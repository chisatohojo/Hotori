; PlatformIO設定（hotori_hardware_test を Arduino Nano でビルド）
; 例: pio run -e nano_new -t upload
;     pio device monitor -e nano_new
; ピン割り当ては hotori_hardware_test/HotoriConfig.h

[platformio]
src_dir = hotori_hardware_test
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
lib_deps =
  ; DfPlayerController.cpp（未使用）のビルドに必要
  dfrobot/DFRobotDFPlayerMini@1.0.6
  teemuatlut/TMCStepper@0.7.3
  arduino-libraries/Servo@1.2.2
monitor_speed = 115200
build_flags =
  -Wall
  ; 1にすると起動時にMotor3/Motor4/Motor5を自動で正転させる。ESP32の指示で動かすため0
  -D AUTO_RUN=0

; Arduino Nano（旧ブートローダ。互換品の多くはこちら）
[env:nano]
board = nanoatmega328

; Arduino Nano（新ブートローダ。書き込みに失敗する場合はこちら）
[env:nano_new]
board = nanoatmega328new
